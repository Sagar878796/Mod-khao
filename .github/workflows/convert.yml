name: JSON to M3U Catalogue

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch JSON and create M3U catalogue
        run: |
          python3 - <<'PY'
          import json
          import urllib.request

          source = "https://lemajekaat.streamxlive.workers.dev/"

          req = urllib.request.Request(
              source,
              headers={"User-Agent": "Mozilla/5.0"}
          )

          with urllib.request.urlopen(req, timeout=30) as response:
              data = json.loads(response.read().decode("utf-8"))

          if isinstance(data, dict):
              for key in ("channels", "data", "results"):
                  if isinstance(data.get(key), list):
                      data = data[key]
                      break

          if not isinstance(data, list):
              raise ValueError("Expected a JSON list of channels")

          lines = ["#EXTM3U"]
          count = 0

          for item in data:
              if not isinstance(item, dict):
                  continue

              channel_id = str(item.get("id", ""))
              name = str(item.get("name", "Unknown"))
              category = str(item.get("category", "Other"))
              logo = str(item.get("logo", ""))

              # Metadata only; do not export stream URLs or credentials.
              lines.append(
                  f'#EXTINF:-1 tvg-id="{channel_id}" '
                  f'tvg-logo="{logo}" group-title="{category}",{name}'
              )

              count += 1

          if count == 0:
              raise ValueError("No channel metadata found")

          with open("channels.m3u", "w", encoding="utf-8") as f:
              f.write("\n".join(lines) + "\n")

          print(f"Created catalogue: {count} channels")

          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add channels.m3u

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update channel catalogue"
            git push
          fi
